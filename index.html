<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMS Pro</title>
    <link rel="stylesheet" href="/src/RMSProQRAdminTheme.css" />
  </head>
  <body>
    <div id="root">
      <main class="rms-startup">
        <section class="rms-startup-card" aria-live="polite">
          <strong>RMS <span>PRO</span></strong>
          <div class="rms-startup-bar"><i></i></div>
          <p>Загрузка RMS SaaS…</p>
        </section>
      </main>
    </div>
    <style>
      .rms-startup{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f9fd;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10233f}
      .rms-startup-card{width:min(100%,360px);padding:32px;border:1px solid #dce6f2;border-radius:22px;background:#fff;box-shadow:0 24px 70px rgba(16,35,63,.1);text-align:center}
      .rms-startup-card strong{display:block;font-size:30px;letter-spacing:.08em}.rms-startup-card strong span{color:#c99a45}
      .rms-startup-card p{margin:15px 0 0;color:#64748b;font-size:14px;font-weight:700}
      .rms-startup-bar{height:5px;margin-top:22px;overflow:hidden;border-radius:999px;background:#e5edf6}
      .rms-startup-bar i{display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#10233f,#2f6de1);animation:rms-startup 1.15s ease-in-out infinite}
      @keyframes rms-startup{0%{transform:translateX(-110%)}100%{transform:translateX(245%)}}
    </style>
    <script>var branches = [];</script>
    <script defer src="/assets/qr-admin-host-v1.js"></script>
    <script type="module">
      const root = document.getElementById('root')
      const supabaseUrl =
        import.meta.env.VITE_SAAS_SUPABASE_URL ||
        import.meta.env.VITE_SUPABASE_URL
      const supabaseKey =
        import.meta.env.VITE_SAAS_SUPABASE_PUBLISHABLE_KEY ||
        import.meta.env.VITE_SUPABASE_ANON_KEY

      if (supabaseUrl && supabaseKey) {
        import('/src/main.jsx')
      } else {
        document.body.style.margin = '0'
        document.body.style.background = '#f8fafc'
        root.innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a">
            <section style="width:min(100%,520px);padding:32px;border:1px solid #e2e8f0;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.08)">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
                <span style="display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#2563eb;color:#fff;font-weight:800">R</span>
                <div><strong style="display:block;font-size:18px">RMS Pro</strong><span style="color:#64748b;font-size:13px">Preview · QR Admin theme</span></div>
              </div>
              <h1 style="margin:0 0 10px;font-size:24px;line-height:1.25">Preview ещё не подключён к staging</h1>
              <p style="margin:0;color:#64748b;line-height:1.6">Для Preview не найдена конфигурация staging Supabase.</p>
            </section>
          </main>
        `
      }
    </script>
  </body>
</html>
