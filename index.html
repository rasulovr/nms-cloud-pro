<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMS Pro</title>
    <link rel="stylesheet" href="/src/RMSProQRAdminTheme.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>var branches = [];</script>
    <script type="module">
      const root = document.getElementById('root')
      const isConfigured = Boolean(
        import.meta.env.VITE_SUPABASE_URL &&
        import.meta.env.VITE_SUPABASE_ANON_KEY
      )

      if (isConfigured) {
        import('/src/main.jsx')
      } else {
        document.body.style.margin = '0'
        document.body.style.background = '#f8fafc'
        root.innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a">
            <section style="width:min(100%,520px);padding:32px;border:1px solid #e2e8f0;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.08)">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
                <span style="display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#2563eb;color:#fff;font-weight:800">R</span>
                <div><strong style="display:block;font-size:18px">RMS Pro</strong><span style="color:#64748b;font-size:13px">Preview · QR Admin theme</span></div>
              </div>
              <h1 style="margin:0 0 10px;font-size:24px;line-height:1.25">Preview ещё не подключён к staging</h1>
              <p style="margin:0;color:#64748b;line-height:1.6">В окружении Preview отсутствуют VITE_SUPABASE_URL и VITE_SUPABASE_ANON_KEY. После их включения для Preview форма входа откроется автоматически.</p>
            </section>
          </main>
        `
      }
    </script>
  </body>
</html>
